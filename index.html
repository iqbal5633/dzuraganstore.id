<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Linktree</title>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background: linear-gradient(135deg,#111,#1f1f1f);
      color:white;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      padding:20px;
    }

    .container{
      width:100%;
      max-width:400px;
      text-align:center;
    }

    .profile img{
      width:120px;
      height:120px;
      border-radius:50%;
      border:4px solid white;
      object-fit:cover;
      margin-bottom:15px;
    }

    .profile h1{
      font-size:28px;
      margin-bottom:8px;
    }

    .profile p{
      color:#ccc;
      margin-bottom:30px;
    }

    .link{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      background:white;
      color:#111;
      text-decoration:none;
      padding:15px;
      border-radius:15px;
      margin-bottom:15px;
      font-weight:bold;
      transition:0.3s;
    }

    .link:hover{
      transform:scale(1.05);
      color:white;
    }

    .link.whatsapp:hover{
      background:#25D366;
    }

    .link.tiktok:hover{
      background:#000;
    }

    .link.instagram:hover{
      background:linear-gradient(
        45deg,
        #feda75,
        #fa7e1e,
        #d62976,
        #962fbf,
        #4f5bd5
      );
    }

    .link.website:hover{
      background:#4f46e5;
    }

    .footer{
      margin-top:20px;
      font-size:14px;
      color:#aaa;
    }
  </style>
</head>
<body>

  <div class="container">

    <div class="profile">
      <img src="https://i.ibb.co.com/Jw8BYtfq/IMG-20260419-200516.jpg" alt="Profile">
      <h1>Iqbal & Dzuraganstore</h1>
      <p>Welcome to my social links 🚀</p>
    </div>

    <!-- WhatsApp -->
    <a href="https://wa.me/6281271617785" class="link whatsapp" target="_blank">
      <i class="fab fa-whatsapp"></i>
      WhatsApp
    </a>

    <!-- TikTok -->
    <a href="https://tiktok.com/@dzuraganstore" class="link tiktok" target="_blank">
      <i class="fab fa-tiktok"></i>
      TikTok
    </a>

    <!-- Instagram -->
    <a href="https://www.instagram.com/ballsmxxs?igsh=eTRzdXV0cXU5NXR2" class="link instagram" target="_blank">
      <i class="fab fa-instagram"></i>
      Instagram
    </a>

    <!-- Website SMM -->
    <a href="https://smmdzuragan.vercel.app/" class="link website" target="_blank">
      <i class="fas fa-globe"></i>
      Website SMM
    </a>

    <div class="footer">
      © 2026 My Linktree
    </div>

  </div>

</body>
</html>
